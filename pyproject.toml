[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot AI (Python + Flask + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
